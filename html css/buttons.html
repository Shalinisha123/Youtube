<style>
.subscribe-button{
background-color: rgb(204,0, 0);
color:white; 
border:none;
height:36px;
width:105px;
border-radius: 2px;
cursor: pointer;
margin-left:2px;
transition: opacity 0.15s;
padding-left: 16px;
padding-right: 16px;
padding-top: 10px;
padding-bottom: 10px;
vertical-align: top;
}
.subscribe-button:hover{
    opacity:0.8;
}
.subscribe-button:active{
    opacity:0.5;
}


.join-button
{
    background-color: white;
    color:rgb(6,95,212);
    border-color:rgb(6,95,212);
   
    border-style: solid;
    border-width: 1px;
    border-radius: 2px;
    cursor:pointer;
    margin-left: 5px;
    transition: background-color 0.15s;
    color 0.15s;
    vertical-align: top;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: 9px;
    padding-bottom: 9px;
}
.join-button:hover
{
    background-color:rgb(6, 95, 212); 
    color:white;   
}
.join-button:active{
    opacity: 0.7;
}

    .tweet-button{
    background-color:rgb(29,155,240);
    color:white;
    border-color:rgb(29, 155, 240);
    height:36px;
    width:70px;
    border-style: solid;
    border-width: 1px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 12px;;
    cursor:pointer;
    margin-left:5px;
   
    padding-left: 13px;
    padding-right: 13px;
    padding-top:9px;
    padding-bottom: 9px;
    
    }
        
    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0,0 ,0, 0.15);
    }
</style>




<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN </button>
<button class="tweet-button">TWEET</button>
